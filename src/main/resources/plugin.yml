name: SoulAuction
version: '${version}'
main: bm.b0b0b0.soulAuction.SoulAuction
api-version: '1.21'
folia-supported: true
authors: [ b0b0b0 ]
softdepend: [ Vault, PlayerPoints, PlaceholderAPI, CoinsEngine, SkinsRestorer, WorldGuard ]
libraries:
  - net.elytrium:serializer:1.1.1
  - com.google.code.gson:gson:2.14.0
  - com.zaxxer:HikariCP:6.3.0
  - com.mysql:mysql-connector-j:9.7.0
  - org.xerial:sqlite-jdbc:3.53.2.1
  - redis.clients:jedis:7.5.3
permissions:
  soulauction.command.ah:
    default: true
  soulauction.command.sell:
    default: true
  soulauction.command.my:
    default: true
  soulauction.command.claim:
    default: true
  soulauction.command.view:
    default: true
  soulauction.command.cancel.any:
    default: op
  soulauction.command.limit:
    default: op
  soulauction.command.reload:
    default: op
  soulauction.command.admin:
    default: op
  soulauction.command.regions:
    default: true
  soulauction.region.sell:
    default: true
  soulauction.region.buy:
    default: true
  soulauction.priority.1:
    default: false
    description: Higher listing sort priority (use soulauction.priority.N)
